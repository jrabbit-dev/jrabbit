name: Dependency review

# Blocks PRs that add vulnerable dependencies or non-permissive licenses.
on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  review:
    # Dependency review is free on public repositories only.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          allow-licenses: >-
            MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0, 0BSD,
            BlueOak-1.0.0, CC0-1.0, Unlicense, Python-2.0, CC-BY-4.0
