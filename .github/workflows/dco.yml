name: DCO

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  signoff:
    name: Check Signed-off-by
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit must be signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author_email=$(git show -s --format='%ae' "$sha")
            if [[ "$author_email" == *"[bot]@users.noreply.github.com" ]]; then continue; fi
            if ! git show -s --format='%B' "$sha" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::Commit $sha is missing Signed-off-by. See CONTRIBUTING.md#licensing"
              missing=1
            fi
          done
          exit $missing
