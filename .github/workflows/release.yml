name: Release

# Publishes to npm with trusted publishing (OIDC, no npm token stored)
# and a provenance attestation. Runs when a GitHub release is published.
on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    # Provenance requires a public repository.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Tag must match package version
        working-directory: packages/jrabbit
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          test "$TAG" = "v$version" || { echo "::error::Tag $TAG does not match package version v$version"; exit 1; }
      - name: Install
        run: npm ci
      - name: Build
        working-directory: packages/jrabbit
        run: npm run build
      - name: Typecheck and test
        working-directory: packages/jrabbit
        run: npm run typecheck && npm test
      - name: Package must contain the build
        working-directory: packages/jrabbit
        run: |
          files=$(npm pack --dry-run --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)[0].files.map(f=>f.path).join("\n")))')
          for f in dist/cli.js dist/overlay.js bin/jrabbit.js; do
            echo "$files" | grep -qx "$f" || { echo "::error::$f is missing from the package"; exit 1; }
          done
      - name: Publish
        working-directory: packages/jrabbit
        run: npm publish --provenance --access public
